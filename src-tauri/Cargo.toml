[package]
name = "vibe-board"
version = "3.1.1"
description = "Monitor, manage, and coordinate coding agents from Vibe Board"
authors = ["Vibe Board"]
license = "Apache-2.0"
edition = "2021"
default-run = "vibe-board"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "vibe_board_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "vibe-board-bridge"
path = "src/bridge/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dashmap = "6"
log = "0.4"
tauri-plugin-log = "2"
anyhow = "1"
thiserror = "2"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
base64 = "0.22"
rodio = "0.19"
notify = "7"
zip = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "brotli", "deflate", "zstd"] }
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
toml_edit = "0.25"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
axum = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.3", features = ["std", "NSWindow", "NSApplication", "NSImage", "NSDockTile"] }
objc2-foundation = { version = "0.3", features = ["objc2-core-foundation"] }
