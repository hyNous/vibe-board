<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Board — a screen-edge task board for AI coding agents</title>
  <desc id="desc">Vibe Board docks a compact island to the screen edge and shows task status, approvals, and usage for AI coding agents such as Claude Code, Codex, and OpenCode, alongside agent and Skill management.</desc>

  <defs>
    <clipPath id="frame"><rect width="1200" height="360" rx="28" /></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#FBF4E6" />
    <circle cx="70" cy="372" r="150" fill="#F4E7D1" />
    <path d="M1140 0 L1172 0 A28 28 0 0 1 1200 28 L1200 332 A28 28 0 0 1 1172 360 L1140 360 Z" fill="#EFE2CB" />
    <path d="M1140 0 L1140 360" stroke="#D8CBB2" stroke-width="2" />
  </g>

  <g transform="translate(72 62)">
    <text x="0" y="0" fill="#0C6B63" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="700" letter-spacing="2.6">SCREEN-EDGE TASK BOARD</text>
    <text x="0" y="74" fill="#0F3B36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="64" font-weight="800" letter-spacing="-2">Vibe Board</text>
    <text x="0" y="120" fill="#2C4A46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="27">Your AI coding agents, at the screen edge.</text>
    <text x="0" y="154" fill="#6A7A75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20">Task status · approvals · usage · Agents + Skills</text>

    <g transform="translate(0 190)">
      <rect width="162" height="42" rx="21" fill="#E1F0EA" stroke="#9FCFC0" />
      <circle cx="24" cy="21" r="6" fill="#0C6B63" />
      <text x="42" y="28" fill="#0B4F4A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">Local-only</text>

      <rect x="174" width="172" height="42" rx="21" fill="#FBE8D2" stroke="#EDBF90" />
      <circle cx="198" cy="21" r="6" fill="#D9772A" />
      <text x="216" y="28" fill="#8A4A12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">Windows x64</text>

      <rect x="358" width="222" height="42" rx="21" fill="#EFE8D8" stroke="#DBCDB1" />
      <circle cx="382" cy="21" r="6" fill="#7A8A84" />
      <text x="400" y="28" fill="#41544E" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">Best-effort sync</text>
    </g>
  </g>

  <g transform="translate(680 42)">
    <rect x="0" y="0" width="460" height="276" rx="24" fill="#FFFFFF" stroke="#E7DBC3" stroke-width="2" />
    <text x="28" y="36" fill="#6A7A75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21">3 tasks in view</text>

    <g transform="translate(28 56)">
      <rect width="352" height="56" rx="14" fill="#F7F1E4" />
      <circle cx="26" cy="28" r="7" fill="#0C6B63" />
      <text x="48" y="36" fill="#153D39" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21">Claude Code</text>
      <text x="326" y="35" text-anchor="end" fill="#0C6B63" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">RUNNING</text>
    </g>
    <g transform="translate(28 120)">
      <rect width="352" height="56" rx="14" fill="#F7F1E4" />
      <circle cx="26" cy="28" r="7" fill="#D9772A" />
      <text x="48" y="36" fill="#153D39" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21">Codex</text>
      <text x="326" y="35" text-anchor="end" fill="#C96A1E" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">WAITING</text>
    </g>
    <g transform="translate(28 184)">
      <rect width="352" height="56" rx="14" fill="#F7F1E4" />
      <circle cx="26" cy="28" r="7" fill="#7A8A84" />
      <text x="48" y="36" fill="#153D39" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21">OpenCode</text>
      <text x="326" y="35" text-anchor="end" fill="#5E7A73" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">DONE</text>
    </g>

    <rect x="436" y="70" width="52" height="150" rx="26" fill="#0B1017" />
    <circle cx="462" cy="100" r="7" fill="#2FD3A8" />
    <circle cx="462" cy="130" r="7" fill="#F0A24B" />
    <circle cx="462" cy="160" r="7" fill="#6E8290" />
    <rect x="452" y="182" width="20" height="7" rx="3.5" fill="#3A4854" />
  </g>
</svg>
