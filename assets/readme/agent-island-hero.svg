<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent Island desktop control console</title>
  <desc id="desc">Agent Island collects AI coding agent sessions, approvals, traces, token usage, quota snapshots, and shared skills in one floating desktop workspace.</desc>

  <rect width="1200" height="360" rx="28" fill="#111827"/>
  <path d="M56 296H1144" stroke="#2A3446" stroke-width="2"/>

  <g id="title-block" transform="translate(64 52)">
    <text x="0" y="0" fill="#71E0C3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" font-weight="700" letter-spacing="3">DESKTOP AGENT CONSOLE</text>
    <text x="0" y="72" fill="#F7F9FC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="62" font-weight="800" letter-spacing="-2">Agent Island</text>
    <text x="0" y="116" fill="#C8D0DE" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="24">See every coding agent clearly, without chasing terminals.</text>
    <text x="0" y="151" fill="#8793A8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20">Sessions · approvals · trace time · token/quota · shared Skills</text>

    <g transform="translate(0 199)">
      <rect width="124" height="40" rx="20" fill="#1B2E37" stroke="#2C665D"/>
      <circle cx="23" cy="20" r="6" fill="#71E0C3"/>
      <text x="39" y="27" fill="#DDFBF2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">Hooks</text>
      <rect x="136" width="124" height="40" rx="20" fill="#25283A" stroke="#4C5270"/>
      <circle cx="159" cy="20" r="6" fill="#9E9BFF"/>
      <text x="175" y="27" fill="#E9E7FF" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">Trace</text>
      <rect x="272" width="170" height="40" rx="20" fill="#3A3020" stroke="#8E6E39"/>
      <circle cx="295" cy="20" r="6" fill="#F3C567"/>
      <text x="311" y="27" fill="#FFF0C7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">Token / quota</text>
    </g>
  </g>

  <g id="session-proof" transform="translate(714 40)">
    <rect x="0" y="0" width="422" height="270" rx="24" fill="#0B101A" stroke="#334158" stroke-width="2"/>
    <rect x="24" y="22" width="374" height="50" rx="25" fill="#182333"/>
    <circle cx="52" cy="47" r="8" fill="#71E0C3"/>
    <text x="72" y="54" fill="#F7F9FC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21" font-weight="700">3 sessions in view</text>
    <text x="310" y="53" fill="#8793A8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">LOCAL</text>

    <g transform="translate(24 92)">
      <rect width="374" height="48" rx="14" fill="#182333"/>
      <circle cx="22" cy="24" r="6" fill="#71E0C3"/>
      <text x="40" y="30" fill="#DCE5F1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18">Claude Code</text>
      <text x="286" y="30" fill="#71E0C3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">RUNNING</text>
    </g>
    <g transform="translate(24 148)">
      <rect width="374" height="48" rx="14" fill="#182333"/>
      <circle cx="22" cy="24" r="6" fill="#F3C567"/>
      <text x="40" y="30" fill="#DCE5F1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18">Codex</text>
      <text x="292" y="30" fill="#F3C567" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">WAITING</text>
    </g>
    <g transform="translate(24 204)">
      <rect width="374" height="48" rx="14" fill="#182333"/>
      <circle cx="22" cy="24" r="6" fill="#9E9BFF"/>
      <text x="40" y="30" fill="#DCE5F1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18">OpenCode</text>
      <text x="310" y="30" fill="#9E9BFF" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">TRACE</text>
    </g>
  </g>

  <g id="island-mark" transform="translate(1070 314)">
    <rect width="66" height="26" rx="13" fill="#71E0C3"/>
    <text x="33" y="19" text-anchor="middle" fill="#111827" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700">AI</text>
  </g>
</svg>
